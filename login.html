<!DOCTYPE html>
<html>
<head>
    <title>SecuraX | Login</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="container">
    <div class="auth-card">
        <div class="brand">Welcome to <span>SecuraX</span></div>
        <h1>Sign in</h1>

        <form action="login" method="post">

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <!-- 🔐 CAPTCHA -->
            <div class="input-group">
                <label>Enter CAPTCHA: <b>${captcha}</b></label>
                <input type="text" name="captchaInput">
            </div>

            <div class="actions">
                <button type="submit">Sign in</button>
            </div>
        </form>

        <div class="link">
            New user? <a href="register.html">Create account</a>
        </div>
    </div>
</div>

</body>
</html>
